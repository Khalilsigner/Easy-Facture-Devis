<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon.png">
<title>Easy Facture & Devis — Intro</title>
<style>
:root{--bg:#f5f9fc;--bg2:#e3eff7;--blue:#23769f;--ink:#12394e;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a24;--bg2:#10293a;--ink:#cfe6f3}}
:root[data-theme="dark"]{--bg:#0b1a24;--bg2:#10293a;--ink:#cfe6f3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink);padding:24px}
#app h1{font-size:clamp(22px,4vw,34px);color:var(--blue);margin-bottom:10px}
#app p{opacity:.75}
#splash{position:absolute;inset:0;z-index:5;display:grid;place-items:center;
 background:radial-gradient(circle at 50% 45%,var(--bg2),var(--bg) 70%);
 transition:transform 1s cubic-bezier(.77,0,.18,1),opacity .4s 0.7s}
#splash.out{transform:translateY(-100%);opacity:0;pointer-events:none}
.grid{position:absolute;inset:0;opacity:.35;background-image:linear-gradient(var(--blue) 1px,transparent 1px),linear-gradient(90deg,var(--blue) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000,transparent 60%);mask-image:radial-gradient(circle at 50% 45%,#000,transparent 60%);animation:gridIn 1.6s ease both}
@keyframes gridIn{from{opacity:0;transform:scale(1.15)}to{opacity:.12;transform:scale(1)}}
.stack{position:relative;width:min(88vw,620px);display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vw,24px)}
.ico{position:relative;width:clamp(120px,26vw,190px);aspect-ratio:222/121;animation:pop .9s cubic-bezier(.2,1.4,.4,1) .2s both}
.ico img,.ttl img,.tag img{display:block;width:100%;height:auto}
.ico::before{content:"";position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(closest-side,rgba(35,118,159,.45),transparent);filter:blur(10px);animation:glow 2.4s ease-in-out .6s infinite alternate;z-index:-1}
.ico .draw{animation:wipe .9s cubic-bezier(.65,0,.35,1) .3s both}
.ico .shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;-webkit-mask:var(--icon) center/100% 100% no-repeat;mask:var(--icon) center/100% 100% no-repeat;animation:shine 1.2s ease 1.3s both,shine 3.5s ease 4s infinite}
.ttl{width:100%;position:relative;animation:wipe 1s cubic-bezier(.65,0,.35,1) 1s both}
.ttl::after{content:"";position:absolute;top:-30%;bottom:-30%;width:3px;background:var(--blue);box-shadow:0 0 14px 3px var(--blue);border-radius:2px;animation:scan 1s cubic-bezier(.65,0,.35,1) 1s both}
.tag{width:72%;animation:rise .8s ease 2.1s both}
.bar{width:min(60vw,260px);height:4px;border-radius:4px;background:rgba(35,118,159,.18);overflow:hidden;margin-top:6px;animation:rise .5s ease 2.2s both}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--blue),#5fb4dd);transform-origin:left;animation:load 1.3s cubic-bezier(.5,0,.2,1) 2.3s both}
.btn{margin-top:4px;padding:12px 30px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:600 15px system-ui;cursor:pointer;opacity:0;pointer-events:none;box-shadow:0 8px 24px rgba(35,118,159,.4);transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.show{animation:rise .6s ease both;pointer-events:auto}
.replay{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;background:none;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:6px 14px;font:13px system-ui;cursor:pointer}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes scan{from{left:0;opacity:1}90%{opacity:1}to{left:100%;opacity:0}}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes glow{from{opacity:.4;transform:scale(.9)}to{opacity:1;transform:scale(1.1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>
